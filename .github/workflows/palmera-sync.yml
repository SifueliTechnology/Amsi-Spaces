name: Daily Palmera catalogue sync

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/palmera-sync
        run: |
          # Hits the Pages project's own *.pages.dev address rather than the
          # custom domain, so it isn't subject to that domain's Cloudflare
          # security settings (Bot Fight Mode etc.) — it's the same app and
          # still requires the shared secret below either way.
          status=$(curl -s -o /tmp/response.txt -w '%{http_code}' \
            -X POST "https://amsi-spaces.pages.dev/api/palmera-sync" \
            -H "X-Sync-Secret: ${{ secrets.PALMERA_SYNC_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            echo "Sync failed"
            exit 1
          fi
