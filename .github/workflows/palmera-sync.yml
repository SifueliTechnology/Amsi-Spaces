name: Daily Palmera catalogue sync

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/palmera-sync
        run: |
          status=$(curl -s -o /tmp/response.txt -w '%{http_code}' \
            -X POST "https://amsispaces.com/api/palmera-sync" \
            -H "X-Sync-Secret: ${{ secrets.PALMERA_SYNC_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            echo "Sync failed"
            exit 1
          fi
